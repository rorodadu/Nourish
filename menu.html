<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Menu – Nourish</title>
<link rel="icon" type="image/x-icon" href="icon.ico?v=2"><link rel="shortcut icon" href="icon.ico?v=2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Figtree:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="auth.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>
:root{--bg:#f4f8f4;--card:#fff;--ink:#14261c;--mute:#566a5d;--line:#d6e1d7;--leaf:#1f7a4d;--leaf-t:#dff1e6;--citrus:#a86a00;--citrus-t:#fdecc8;--berry:#b8304f;--on-leaf:#fff;--deep:#14261c;--on-deep:#e8f1ea;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1a14;--card:#16251c;--ink:#e8f1ea;--mute:#9db1a3;--line:#294034;--leaf:#4fc088;--leaf-t:#1b3a2a;--citrus:#f0b44a;--citrus-t:#3a2d12;--berry:#ff7a96;--on-leaf:#0b1a12;--deep:#0a120e;--on-deep:#e8f1ea}}
:root[data-theme="dark"]{--bg:#0f1a14;--card:#16251c;--ink:#e8f1ea;--mute:#9db1a3;--line:#294034;--leaf:#4fc088;--leaf-t:#1b3a2a;--citrus:#f0b44a;--citrus-t:#3a2d12;--berry:#ff7a96;--on-leaf:#0b1a12;--deep:#0a120e;--on-deep:#e8f1ea}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:calc(116px + env(safe-area-inset-top,0px));-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.5 Figtree,system-ui,-apple-system,Segoe UI,sans-serif;padding-bottom:calc(110px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{font-family:"Bricolage Grotesque",Figtree,system-ui,sans-serif;margin:0;line-height:1.1;letter-spacing:-.015em}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--leaf);outline-offset:3px}
[hidden]{display:none!important}
.wrap{max-width:640px;margin:0 auto;padding:0 18px}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:12px;height:56px}
.top .rn{font:800 21px "Bricolage Grotesque",sans-serif;color:var(--leaf);margin-right:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tbl{flex:none;background:var(--leaf);color:var(--on-leaf);font-weight:700;border:0;border-radius:999px;padding:6px 14px;font-size:15px;min-height:36px}
.tbl.none{background:var(--citrus-t);color:var(--citrus)}
.secs{border-bottom:1px solid var(--line);background:var(--bg)}
.secs .wrap{display:flex;gap:8px;overflow-x:auto;padding-top:8px;padding-bottom:8px;scrollbar-width:none}
.secs a{flex:none;text-decoration:none;color:var(--ink);font-weight:500;font-size:15px;padding:8px 16px;border-radius:999px;border:1px solid var(--line)}
.secs a:hover{background:var(--leaf-t)}
.secsin{max-width:640px;margin:0 auto;position:relative}
.secs .wrap{cursor:grab;scroll-behavior:smooth}
.secs .wrap.drag{cursor:grabbing;scroll-behavior:auto}
.snb{position:absolute;top:50%;transform:translateY(-50%);z-index:2;width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);font:700 22px/1 Figtree,system-ui,sans-serif;cursor:pointer;display:grid;place-items:center;box-shadow:0 2px 8px rgba(0,0,0,.25);padding:0}
.snb.l{left:2px}.snb.r{right:2px}
.snb[hidden]{display:none}
@media (hover:none){.snb{display:none}}
.stick{position:sticky;top:calc(56px + env(safe-area-inset-top,0px));z-index:19}

/* intro, goal, filters */
.intro{padding:26px 0 8px}
.intro h1{font-size:clamp(30px,8vw,40px);font-weight:800}
.intro p{color:var(--mute);margin:8px 0 0}
.goal{margin:18px 0 0;border:1px solid var(--line);background:var(--card);border-radius:16px;padding:16px}
.goal .gh{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.goal label{font-weight:700}
.goal input{width:112px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);text-align:right}
.meter{height:12px;border-radius:999px;background:var(--leaf-t);overflow:hidden;margin:12px 0 8px}
.meter i{display:block;height:100%;width:0;background:var(--leaf);border-radius:999px;transition:width .25s}
.meter.over i{background:var(--berry)}
.gtxt{margin:0;font-size:15px;color:var(--mute)}
.gtxt b{color:var(--ink)}
.gtxt.over b{color:var(--berry)}
details.flt{margin:12px 0 0;border:1px solid var(--line);background:var(--card);border-radius:16px;padding:0 16px}
details.flt summary{padding:14px 0;font-weight:700;cursor:pointer;display:flex;justify-content:space-between;gap:12px}
details.flt summary span{color:var(--mute);font-weight:500}
.fgroup{padding:2px 0 16px}
.fgroup h3{font:700 16px Figtree,sans-serif;margin:0 0 4px}
.fgroup p{margin:0 0 10px;font-size:14px;color:var(--mute)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{position:relative;padding:8px 14px;border:1px solid var(--line);border-radius:999px;font-size:15px;font-weight:500;cursor:pointer;background:var(--bg)}
.chip input{position:absolute;opacity:0;inset:0;cursor:pointer;margin:0}
.chip:has(input:checked){background:var(--leaf);color:var(--on-leaf);border-color:var(--leaf);font-weight:700}
.chip.avoid:has(input:checked){background:var(--berry);border-color:var(--berry);color:#fff}
.chip:has(input:focus-visible){outline:3px solid var(--leaf);outline-offset:2px}
.hid{margin:14px 0 0;background:var(--citrus-t);color:var(--citrus);border-radius:12px;padding:10px 14px;font-size:15px;font-weight:500}
.hid button{border:0;background:none;color:inherit;font-weight:700;text-decoration:underline;padding:0}

/* dishes */
.sec{padding-top:30px}
.sec>h2{font-size:30px;font-weight:800;padding-bottom:10px;border-bottom:2px solid var(--ink)}
.dish{display:grid;grid-template-columns:1fr auto;gap:6px 16px;padding:18px 0;border-bottom:1px solid var(--line)}
.dish h3{font-size:21px;font-weight:600}
.dish .desc{margin:4px 0 0;color:var(--mute);font-size:15px}
.dish .facts{display:flex;flex-wrap:wrap;gap:4px 14px;margin:8px 0 0;font-size:14px;color:var(--mute)}
.dish .al{margin:6px 0 0;font-size:14px;font-weight:700;color:var(--citrus)}
.dish .al.none{color:var(--mute);font-weight:500}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tag{font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;background:var(--leaf-t);color:var(--leaf)}
.side{display:flex;flex-direction:column;align-items:flex-end;gap:2px;text-align:right}
.side [data-ctl]{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.kcal{font:800 30px/1 "Bricolage Grotesque",sans-serif}
.kcal small{display:block;font:500 13px Figtree,sans-serif;color:var(--mute);margin-top:2px}
.price{font-weight:700;margin:6px 0 8px}
.dish.out .kcal,.dish.out h3,.dish.out .desc,.dish.out .facts,.dish.out .tags,.dish.out .price{opacity:.45}
.soldout{font-weight:700;color:var(--mute);border:1px dashed var(--line);border-radius:10px;padding:8px 12px;font-size:14px}
.add{background:var(--leaf);color:var(--on-leaf);border:0;border-radius:10px;padding:10px 20px;font-weight:700;min-height:44px}
.add.cbtn{background:transparent;color:var(--leaf);border:2px solid var(--leaf)}
.inord{font-size:13px;font-weight:700;color:var(--leaf)}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;background:var(--card)}
.stepper button{width:44px;height:44px;border:0;background:none;font-size:22px;font-weight:700;border-radius:50%;color:var(--leaf)}
.stepper button:hover{background:var(--leaf-t)}
.stepper output{min-width:24px;text-align:center;font-weight:700}
.empty{text-align:center;padding:50px 0;color:var(--mute)}
.fine{color:var(--mute);font-size:14px;margin:34px 0 0}

/* bottom bar */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--deep);color:var(--on-deep);padding:12px 0 calc(12px + env(safe-area-inset-bottom,0px))}
.bar .wrap{display:flex;align-items:center;gap:14px}
.bar .bi{margin-right:auto;display:flex;flex-wrap:wrap;gap:0 14px;align-items:baseline}
.bar .bi b{font-size:18px}
.bar .bi span{font-size:14px;opacity:.8}
.bar button{background:var(--leaf);color:var(--on-leaf);border:0;border-radius:10px;padding:12px 20px;font-weight:700;min-height:46px}

/* welcome screen */
.welcome{position:fixed;inset:0;z-index:60;background:var(--bg);overflow:auto;display:grid;place-items:center;padding:24px 18px calc(24px + env(safe-area-inset-bottom,0px))}
.wcard{width:100%;max-width:440px}
.wr{font:800 22px "Bricolage Grotesque",sans-serif;color:var(--leaf);margin:0 0 26px}
.wcard h1{font-size:clamp(46px,15vw,76px);font-weight:800}
.wl{color:var(--mute);margin:10px 0 0}

/* sheet */
dialog{border:0;padding:0;background:var(--card);color:var(--ink);width:100%;max-width:560px;max-height:92dvh;margin:auto auto 0;border-radius:22px 22px 0 0;overflow:auto}
dialog::backdrop{background:rgba(10,18,14,.6)}
@media (min-width:640px){dialog{margin:auto;border-radius:22px}}
.sheet{padding:22px 20px calc(24px + env(safe-area-inset-bottom,0px))}
.sh{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:6px}
.sh h2{font-size:28px;font-weight:800}
.x{flex:none;border:1px solid var(--line);background:none;border-radius:999px;width:44px;height:44px;font-size:20px}
.sheet .sub{color:var(--mute);margin:0 0 4px;font-size:15px}
.lines{list-style:none;margin:8px 0 0;padding:0}
.line{padding:16px 0;border-bottom:1px solid var(--line);display:grid;grid-template-columns:1fr auto;gap:8px 12px;align-items:center}
.line .lt b{display:block;font-size:18px}
.line .lt span{color:var(--mute);font-size:14px;display:block}
.line .lt .cu{color:var(--ink)}
.line .nt{grid-column:1/-1;display:grid;gap:4px;font-size:14px;color:var(--mute)}
.line .nt input{padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);width:100%}
.swap{grid-column:1/-1;text-align:left;background:var(--leaf-t);color:var(--leaf);border:0;border-radius:10px;padding:10px 12px;font-weight:700;font-size:14px}
.tot{display:flex;justify-content:space-between;gap:12px;padding:14px 0 4px;font-size:19px;font-weight:700}
.tot.k{font-size:15px;font-weight:500;color:var(--mute);padding-top:0}
.fld{margin-top:18px;border:0;padding:0;min-width:0}
.fld legend,.fld>label.t{font-weight:700;padding:0;margin-bottom:8px;display:block}
.fld input.num,.fld input.txt{padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.fld input.num{width:110px}
.fld input.txt{width:100%}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{position:relative;padding:10px 16px;border:1px solid var(--line);border-radius:999px;font-weight:500;cursor:pointer;min-height:44px;display:flex;align-items:center;gap:8px;background:var(--bg)}
.pill input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.pill .pp{font-size:13px;opacity:.8;font-weight:500}
.pill:has(input:checked){background:var(--leaf);color:var(--on-leaf);border-color:var(--leaf);font-weight:700}
.pill.rm:has(input:checked){background:var(--berry);border-color:var(--berry);color:#fff}
.pill:has(input:focus-visible){outline:3px solid var(--leaf);outline-offset:2px}
.qrow{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:18px}
.qrow b{font-weight:700}
.err{color:var(--berry);font-weight:500;font-size:15px;margin:12px 0 0}
.err:empty{display:none}
.send{width:100%;background:var(--leaf);color:var(--on-leaf);border:0;border-radius:12px;padding:16px 22px;font-weight:700;font-size:18px;margin-top:16px}
.send:disabled{opacity:.6}
.send.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.trk{list-style:none;padding:0;margin:20px 0;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.trk li{text-align:center;padding:12px 6px;border-radius:10px;background:var(--leaf-t);color:var(--mute);font-size:15px;font-weight:500}
.trk li.on{background:var(--leaf);color:var(--on-leaf);font-weight:700}
.trk li.done{color:var(--leaf);font-weight:700}
.summ{margin:0;padding:0;list-style:none;color:var(--mute);font-size:15px}
.summ li{padding:4px 0}
.sheet p.big{font-size:18px;margin:8px 0 0}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.meter i{transition:none}}

/* ---- v2: photos, diner banner, budget, pay split, tracking ---- */
.dish{grid-template-columns:96px 1fr;gap:14px;align-items:start}
.ph{position:relative;width:96px;height:96px;border-radius:14px;background:var(--leaf-t);display:grid;place-items:center;font-size:44px;overflow:hidden}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.buy{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px;flex-wrap:wrap}
.kp{display:flex;align-items:baseline;gap:12px}
.kcal{font-size:24px}
.kcal small{display:inline;margin-left:3px}
.price{margin:0}
.dish.out .ph,.dish.lock .ph,.dish.lock h3,.dish.lock .desc,.dish.lock .facts,.dish.lock .tags,.dish.lock .kcal,.dish.lock .price{opacity:.45}
.lockmsg{font-weight:700;color:var(--berry);border:1px dashed var(--berry);border-radius:10px;padding:8px 12px;font-size:14px}
.dish .al b{color:var(--berry)}
.wh{font-size:clamp(26px,7vw,34px);font-weight:800}
.lnk{border:0;background:none;color:var(--leaf);font-weight:700;text-decoration:underline;padding:8px 0;min-height:44px}
.meter.bud{background:var(--citrus-t)}
.meter.bud i{background:var(--citrus)}
.meter.bud.over i{background:var(--berry)}
.sm{font:700 16px Figtree,sans-serif;margin:18px 0 0}
.paid{list-style:none;padding:0;margin:8px 0 0}
.paid li{padding:10px 12px;border-radius:10px;background:var(--leaf-t);margin-bottom:6px;font-size:15px}
.cardf{display:grid;gap:12px;margin-top:14px}
.cardf label{display:grid;gap:6px;font-weight:500;font-size:15px}
.cardf .two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.spin{width:54px;height:54px;border-radius:50%;border:6px solid var(--leaf-t);border-top-color:var(--leaf);margin:22px auto;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.trk{grid-template-columns:repeat(4,1fr)}
.trk li{font-size:13px}
.passbig{font-size:clamp(34px,10vw,52px);font-weight:800;margin:0 0 12px}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}

/* ---- restaurant chooser ---- */
.pick{padding:28px 0 calc(40px + env(safe-area-inset-bottom,0px))}
.pick .wr{font:800 22px "Bricolage Grotesque",sans-serif;color:var(--leaf);margin:0 0 22px}
.pick h1{font-size:clamp(34px,10vw,52px);font-weight:800}
.pick .wl{color:var(--mute);margin:10px 0 20px}
.pick input[type=search]{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:12px;background:var(--card);margin:0 0 14px;font-size:17px}
.rlist{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.rcard{display:grid;grid-template-columns:1fr auto;gap:2px 14px;align-items:center;text-decoration:none;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;min-height:76px}
.rcard:hover,.rcard:focus-visible{border-color:var(--leaf);background:var(--leaf-t)}
.rcard .rname{font:800 22px "Bricolage Grotesque",sans-serif;grid-column:1}
.rcard .rmeta{grid-column:1;color:var(--mute);font-size:15px}
.rcard .rgo{grid-column:2;grid-row:1/span 2;color:var(--leaf);font-weight:700;white-space:nowrap}
.pick .none{color:var(--mute);margin:14px 0 0}
a.lnk{display:inline-block;line-height:44px;padding:0}
/* ---- table picker + cooking time ---- */
.tgrid{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.tcard{display:grid;place-items:center;min-width:48px;height:48px;padding:0 12px;border:2px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);cursor:pointer;font:inherit;font-weight:700;font-size:17px}
.tinfo{color:var(--mute);font-size:14px;margin:10px 0 0;min-height:1.4em}
.tcard[aria-pressed="true"]{border-color:var(--leaf);background:var(--leaf-t)}
.zrow{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 2px}
.zb{padding:8px 14px;border:1px solid var(--line);border-radius:999px;background:transparent;color:var(--ink);cursor:pointer;font:inherit;min-height:40px}
.zb[aria-pressed="true"]{background:var(--leaf);color:var(--on-leaf);border-color:var(--leaf)}
.tnone{padding:14px;border:1px dashed var(--line);border-radius:12px;color:var(--mute);margin:10px 0 0}
.prep{font-size:13px;color:var(--mute);margin-left:8px}
/* ---- order animations, rating ---- */
.scene{display:grid;place-items:center;margin:8px 0 0;animation:rise .45s ease both}
.scene svg{width:176px;height:132px;overflow:visible}
.scene .bg{fill:var(--leaf-t)}
.scene .ink{fill:none;stroke:var(--ink);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.scene .fc{fill:var(--card)}.scene .lf{fill:var(--leaf)}.scene .ct{fill:var(--citrus,#f2a100)}
.scene .sm2{fill:none;stroke:var(--mute);stroke-width:3;stroke-linecap:round}
.scene .tk{stroke:var(--on-leaf);fill:none;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
.scene .fb{transform-box:fill-box}
@keyframes ring{0%,100%{transform:rotate(0)}12%{transform:rotate(14deg)}28%{transform:rotate(-12deg)}44%{transform:rotate(8deg)}60%{transform:rotate(-4deg)}80%{transform:rotate(0)}}
@keyframes dotb{0%,80%,100%{transform:translateY(0);opacity:.35}40%{transform:translateY(-9px);opacity:1}}
@keyframes rise{from{transform:translateY(12px);opacity:0}to{transform:none;opacity:1}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes pop{0%{transform:scale(.2);opacity:0}70%{transform:scale(1.12);opacity:1}100%{transform:scale(1)}}
@keyframes steam{0%{transform:translateY(10px);opacity:0}30%{opacity:.85}100%{transform:translateY(-24px);opacity:0}}
@keyframes flame{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.4)}}
@keyframes toss{0%,100%{transform:translateY(0) rotate(0)}45%{transform:translateY(-28px) rotate(170deg)}}
@keyframes shake{0%,100%{transform:rotate(0)}50%{transform:rotate(-4deg)}}
@keyframes lift{0%,25%{transform:translateY(0) rotate(0)}65%,100%{transform:translateY(-30px) rotate(-10deg)}}
@keyframes spark{0%,100%{opacity:0;transform:scale(.3)}50%{opacity:1;transform:scale(1)}}
.rate{margin-top:18px;padding:16px;border:1px solid var(--line);border-radius:16px;background:var(--card)}
.rate textarea{width:100%;margin-top:6px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);font:inherit;color:var(--ink);resize:vertical}
.stars{display:flex;gap:6px;margin:8px 0 12px}
.stars .st{width:48px;height:48px;border-radius:12px;border:1px solid var(--line);background:transparent;color:var(--line);font-size:28px;cursor:pointer;line-height:1}
.stars .st.on{color:var(--citrus,#f2a100);border-color:var(--citrus,#f2a100)}
/* ---- table QR code ---- */
.tqr{margin-top:18px;padding:16px;border:1px solid var(--line);border-radius:16px;background:var(--card);text-align:center}
.tqr .sm{margin-top:0}
.qrbox{width:200px;max-width:70%;margin:12px auto;padding:8px;background:#fff;border-radius:12px;line-height:0}
.qrbox svg{width:100%;height:auto;display:block}
.tqr .wl{margin:6px 0 0;font-size:15px}
.tqr .qrtog{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:0;padding:0;cursor:pointer;color:var(--ink);font:inherit;min-height:44px}
.tqr .qrtog .pl{flex:none;width:44px;height:44px;border-radius:50%;background:var(--leaf);color:var(--on-leaf);display:grid;place-items:center;font:700 26px/1 Figtree,system-ui,sans-serif;transition:transform .2s}
.tqr .qrtog[aria-expanded="true"] .pl{transform:rotate(45deg)}
.tqr .qrtog b{display:block;font-weight:700}

function luhn(s){var sum=0,alt=false,n;for(var i=s.length-1;i>=0;i--){n=+s[i];if(alt){n*=2;if(n>9)n-=9}sum+=n;alt=!alt}return sum%10===0}

 }).join("")+'</div></fieldset>';
 if(pay<0)return head+body+f+'<div class="err" id="err" role="alert"></div>';
 var others=rem.filter(function(i){return i!==pay});
 if(others.length)f+='<fieldset class="fld"><legend>Also paying for (optional)</legend><div class="pills">'+others.map(function(i){
  return '<label class="pill"><input type="checkbox" name="more" value="'+i+'"'+(pf.more.indexOf(i)>-1?" checked":"")+'>'+esc(gname(i))+'<span class="pp">'+mad(cartTotalOf(carts[i]).p)+'</span></label>';
 }).join("")+'</div></fieldset>';
 f+='<fieldset class="fld"><legend>How will you pay?</legend><div class="pills">'+

  '<label class="pill"><input type="radio" name="pm" value="cash"'+(pf.method==="cash"?" checked":"")+'>Cash to the server</label></div></fieldset>';
 if(pf.method==="card"){var c=pf.card;f+='<div class="cardf"><p class="sub">Demo checkout: no card is charged or saved. Try 4242 4242 4242 4242.</p>'+
  '<label>Name on card<input class="txt" id="pcname" type="text" autocomplete="cc-name" value="'+esc(c.name||"")+'"></label>'+

  '<label>Security code<input class="txt" id="pccvc" type="text" inputmode="numeric" autocomplete="cc-csc" maxlength="4" value="'+esc(c.cvc||"")+'"></label></div></div>';
 }else f+='<p class="sub" style="margin-top:14px">Hand the cash to your server when your order arrives.</p>';
 var grp=[pay].concat(pf.more.filter(function(i){return others.indexOf(i)>-1}));
 return head+body+f+'<div class="tot"><span>'+esc(gname(pay))+' pays</span><span>'+mad(amt(grp))+'</span></div>'+
  '<div class="err" id="err" role="alert"></div><button type="button" class="send" data-act="paygo">Confirm</button>';

function payGo(){
 var err=$("err");err.textContent="";
 var rem=remaining();
 if(rem.indexOf(pf.payer)<0){err.textContent="Pick your name first.";return}
 var last4="";
 if(pf.method==="card"){
  var c=pf.card,dg=(c.num||"").replace(/\D/g,""),ex=(c.exp||"").replace(/\D/g,""),mm=+ex.slice(0,2),yy=2000+(+ex.slice(2,4)),now=new Date();
  if((c.name||"").trim().length<2){err.textContent="Enter the name on the card.";return}
  if(dg.length<13||!luhn(dg)){err.textContent="Enter a valid card number.";return}
  if(ex.length<4||mm<1||mm>12||yy<now.getFullYear()||(yy===now.getFullYear()&&mm<now.getMonth()+1)){err.textContent="Enter a valid expiry date as MM / YY.";return}
  if(!/^\d{3,4}$/.test(c.cvc||"")){err.textContent="Enter the security code.";return}
  last4=dg.slice(-4);
 }
 var grp=[pf.payer].concat(pf.more.filter(function(i){return i!==pf.payer&&rem.indexOf(i)>-1}));
 payments.push({by:pf.payer,for:grp,method:pf.method,amount:amt(grp),last4:last4});
 pf={payer:-1,more:[],method:pf.method,card:{}};
 drawSheet('input[name="payer"]');
}

/* ---------- sending, then following the order ---------- */
function sendOrder(){
 if(remaining().length)return;
 var items=[],t={p:0,k:0};
 diners.forEach(function(d,i){
  Object.keys(carts[i]).forEach(function(key){
   var l=carts[i][key];if(l.qty<1||!byId[l.id]||byId[l.id].out)return;
   var u=unit(byId[l.id],l.sel);
   items.push({id:l.id,name:byId[l.id].n,qty:l.qty,opts:describe(l),note:(l.note||"").trim(),price:u.p,kcal:u.k,who:d.name,prep:byId[l.id].tm||0});
   t.p+=u.p*l.qty;t.k+=u.k*l.qty;
  });
 });
 var err=$("err");
 if(!items.length){err.textContent="Your order is empty.";return}
 if(REST){
  var oc=occ(),tk=tok();
  if(PICK){
   var tt=TBL.filter(function(x){return String(x.n)===String(tableNo)})[0];
   if(!tt||tt.free===false||(oc[tableNo]&&oc[tableNo]!==tk)){tableNo="";wTable="";renderTable();openWelcome("setup");return}
  }
  oc[tableNo]=tk;wr(localStorage,"nourish-occ:"+REST.id,oc);
 }
 var all=orders(),next=all.reduce(function(m,o){return Math.max(m,o.id)},0)+1;
 var order={id:next,r:RID,rid:REST?REST.id:"",table:tableNo,party:String(diners.length),items:items,eta:etaOf(items),total:t.p,kcal:t.k,
  pay:payments.every(function(p){return p.method==="card"})?"card":"cash",
  payments:payments.map(function(p){return{by:gname(p.by),for:p.for.map(gname),method:p.method,amount:p.amount}}),
  server:SERVERS[Math.floor(Math.random()*SERVERS.length)],assignAt:Date.now()+3500,status:"pending",at:Date.now()};
 function go(id){
  order.id=id;var l=orders();l.push(order);
  if(!wr(localStorage,"nourish-orders",l)){err.textContent="We couldn't send your order. Check that your browser allows storage and try again.";return}
  wr(sessionStorage,"nourish-diner-order",id);
  stage="track";carts=diners.map(function(){return{}});cur=0;cart=carts[0];payments=[];
  renderAll();
  view="track";drawSheet('[data-act="close"]');startPoll();
 }
 if(REST&&N&&N.cloud){
  err.textContent="Sending your order…";
  N.placeOrder(REST.id,tok(),order).then(function(id){err.textContent="";go(id)}).catch(function(e){
   if(/table_taken/.test(String(e&&e.message))){var o2=occ();delete o2[tableNo];wr(localStorage,"nourish-occ:"+REST.id,o2);tableNo="";wTable="";err.textContent="";renderTable();openWelcome("setup");return}
   err.textContent="We couldn't send your order. Check your connection and try again."});
  return;
 }
 go(next);
}
function trackView(){
 var o=activeOrder();
 if(!o)return '<div class="sh"><h2 id="sheetTitle">No active order</h2>'+closeBtn+'</div>';
 var assigning=Date.now()<(o.assignAt||0),at=assigning?0:1+STATUS.indexOf(o.status),sv=esc(o.server||"Your server");
 var steps=["Assigning","Received","Preparing","Ready"].map(function(s,i){
  return '<li class="'+(i===at?"on":i<at?"done":"")+'"'+(i===at?' aria-current="step"':'')+'>'+s+'</li>';
 }).join("");
 var title=assigning?"Assigning your order to a server":o.status==="ready"?"Your order is ready":o.status==="preparing"?"Your order is being prepared":"Order received by the kitchen";
 var msg=assigning?"Please wait a moment.":
  o.status==="ready"?'<b>'+sv+'</b> is picking up your order and bringing it to table '+esc(o.table)+'.':
  o.status==="preparing"?'The kitchen is preparing your order. <b>'+sv+'</b> will pick it up when it is ready.':
  '<b>'+sv+'</b> is your server. The kitchen has your order and will start soon.';
 return '<div class="sh"><h2 id="sheetTitle">Order #'+o.id+'</h2>'+closeBtn+'</div>'+
  '<h3 class="sm" style="margin-top:10px">'+title+'</h3>'+scene(o,assigning)+
  '<p class="big" role="status">'+msg+'</p>'+etaLine(o,assigning)+
  '<ol class="trk" aria-label="Order status">'+steps+'</ol>'+
  '<ul class="summ">'+o.items.map(function(i){
   var extra=[i.opts,i.note].filter(Boolean).join("; ");
   return '<li>'+i.qty+' × '+esc(i.name)+(i.who?' for '+esc(i.who):'')+(extra?' ('+esc(extra)+')':'')+'</li>';
  }).join("")+'<li><b>'+mad(o.total)+'</b>, '+o.kcal+' kcal</li>'+
  (o.payments||[]).map(function(p){return '<li>'+esc(p.by)+' pays '+mad(p.amount)+(p.for.length>1?' for '+p.for.map(esc).join(", "):'')+', '+(p.method==="card"?"by card":"in cash")+'</li>'}).join("")+'</ul>'+tableQR(o)+
  (o.status==="ready"?rateBlock(o):'')+
  (o.status==="ready"&&!o.done?'<button type="button" class="send" data-act="imdone">I\'m done</button>':'')+
  '<button type="button" class="send ghost" data-act="newround">Order more dishes</button>';
}

/* ---------- actions ---------- */
function setQty(key,delta){
 var c=cart[key];if(!c)return;
 var id=c.id;
 c.qty=Math.max(0,Math.min(20,c.qty+delta));
 if(!c.qty)delete cart[key];
 refreshCtl(id);
}
document.addEventListener("click",function(e){
 var b=e.target.closest("[data-act]");if(!b)return;
 var act=b.dataset.act,key=b.dataset.key;
 if(act==="ginc"||act==="gdec"){wGuests=Math.max(1,Math.min(12,wGuests+(act==="ginc"?1:-1)));$("gout").textContent=wGuests;if(PICK){if(wTable&&!tList().some(function(t){return String(t.n)===String(wTable)}))wTable="";refreshTables()}return}
 if(act==="tzone"){wZone=b.dataset.z;refreshTables('.zb[aria-pressed="true"]');return}
 if(act==="tpick"){wTable=b.dataset.n;refreshTables('.tcard[aria-pressed="true"]');return}
 if(act==="setupgo"){setupGo();return}
 if(act==="wcancel"){closeWelcome();return}
 if(act==="pgo"){profileGo();return}
 if(act==="pstart"){if(cur<diners.length-1){cur++;cart=carts[cur]}openWelcome("profile");return}
 if(act==="editprof"){if(stage!=="order")startRound();else openWelcome("profile");return}
 if(act==="finish"){finish();return}
 if(act==="paygo"){payGo();return}
 if(act==="payreset"){payments=[];pf={payer:-1,more:[],method:"card",card:{}};drawSheet();return}
 if(act==="sendorder"){sendOrder();return}
 if(act==="star"){var tx0=$("rcom");if(tx0)rateText=tx0.value;rateStar=+b.dataset.v;drawSheet('.st[aria-checked="true"]');var tx1=$("rcom");if(tx1)tx1.value=rateText;return}
 if(act==="qrtog"){qrOpen=!qrOpen;drawSheet('[data-act="qrtog"]');return}
 if(act==="imdone"){finishVisit();return}
 if(act==="newround"){closeSheet();startRound();return}
 if((act==="inc"||act==="custom")&&stage!=="order"){if(stage==="pay")openSheet("pay");else startRound();return}
 if(act==="inc"||act==="dec"){
  if(act==="inc"){
   var ln=cart[key]||(byId[key]?{id:key,sel:defaultSel(byId[key]),rm:[],qty:0,note:""}:null);
   if(!ln||!afford(unit(byId[ln.id],ln.sel).p))return;
   cart[key]=ln;
  }
  setQty(key,act==="inc"?1:-1);
  refreshAll();
  var sel='[data-key="'+key.replace(/"/g,'\\"')+'"][data-act="'+act+'"]';
  if(sheet.open&&view==="cart"){
   drawSheet(sel);
   if(!sheet.contains(document.activeElement))drawSheet('[data-act="close"]');
  }else{
   var ctx=document.querySelector('#menu [data-ctl="'+key+'"]');
   var f=ctx&&(ctx.querySelector('[data-act="'+act+'"]')||ctx.querySelector('[data-act="inc"]'));
   if(f)f.focus();
  }
  return;
 }
 if(act==="custom"){openCustom(b.dataset.id);return}
 if(act==="cinc"||act==="cdec"){cust.qty=Math.max(1,Math.min(20,cust.qty+(act==="cinc"?1:-1)));updateCust();return}
 if(act==="cadd"){addCustom();return}
 if(act==="swap"){
  var from=cart[key];if(!from)return;
  var to=b.dataset.to,d2=byId[to],sel2=defaultSel(d2),k2=lineKey(to,sel2,[]),n=from.qty;
  var diff=(unit(d2,sel2).p-unit(byId[from.id],from.sel).p)*n;
  if(diff>0&&!afford(diff))return;
  var fromId=from.id,note=from.note;delete cart[key];
  var tgt=cart[k2]||(cart[k2]={id:to,sel:sel2,rm:[],qty:0,note:""});
  tgt.qty=Math.min(20,tgt.qty+n);if(!tgt.note)tgt.note=note;
  refreshCtl(fromId);refreshCtl(to);refreshAll();
  drawSheet('[data-act="inc"]');
  return;
 }
 if(act==="close"){closeSheet();return}
});

document.addEventListener("input",function(e){

 if(t.dataset&&t.dataset.note!==undefined&&cart[t.dataset.note]){cart[t.dataset.note].note=t.value;return}
 if(t.id==="cnote"&&cust){cust.note=t.value;return}
 if(t.id==="wtbl"){wTable=t.value.replace(/\D/g,"").slice(0,3);if(t.value!==wTable)t.value=wTable;return}

 if(t.id==="pname"){P().name=t.value;return}
 if(t.id==="pgoal"){var v=Math.floor(+t.value);P().goal=v>0&&v<=5000?v:0;return}
 if(/^pc/.test(t.id)){
  var k=t.id.slice(2);
  if(k==="num"){var dg=t.value.replace(/\D/g,"").slice(0,16);t.value=dg.replace(/(.{4})/g,"$1 ").trim()}
  if(k==="exp"){var x=t.value.replace(/\D/g,"").slice(0,4);t.value=x.length>2?x.slice(0,2)+" / "+x.slice(2):x}
  if(k==="cvc")t.value=t.value.replace(/\D/g,"").slice(0,4);
  pf.card[k]=t.value;
 }
});
/* choices, allergies, payment options */
document.addEventListener("change",function(e){
 var t=e.target;
 if(view==="custom"&&cust&&sheet.open){
  var m=/^g(\d+)$/.exec(t.name||"");
  if(m){
   var gi=+m[1],g=byId[cust.id].g[gi],ci=+t.value;
   if(g.t==="one")cust.sel[gi]=[ci];
   else{var a=cust.sel[gi],ix=a.indexOf(ci);if(t.checked&&ix<0)a.push(ci);if(!t.checked&&ix>-1)a.splice(ix,1)}
   updateCust();return;
  }
  if(t.name==="rm"){
   var ri=+t.value,j=cust.rm.indexOf(ri);
   if(t.checked&&j<0)cust.rm.push(ri);
   if(!t.checked&&j>-1)cust.rm.splice(j,1);
   return;
  }
 }
 if(t.name==="avoid"||t.name==="diet"){
  var arr=P()[t.name==="diet"?"diets":"avoid"],i=arr.indexOf(t.value);
  if(t.checked&&i<0)arr.push(t.value);
  if(!t.checked&&i>-1)arr.splice(i,1);
  return;
 }
 if(t.name==="payer"){pf.payer=+t.value;pf.more=pf.more.filter(function(i){return i!==pf.payer});drawSheet('input[name="payer"]:checked');return}
 if(t.name==="more"){
  var n=+t.value,p=pf.more.indexOf(n);
  if(t.checked&&p<0)pf.more.push(n);if(!t.checked&&p>-1)pf.more.splice(p,1);
  drawSheet('input[name="more"][value="'+n+'"]');return;
 }
 if(t.name==="pm"){pf.method=t.value;drawSheet('input[name="pm"]:checked')}
});
